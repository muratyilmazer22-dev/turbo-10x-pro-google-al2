<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#131314" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TURBO 10X" />
    <meta name="application-name" content="TURBO 10X" />
    <meta name="msapplication-TileColor" content="#131314" />
    <meta name="msapplication-navbutton-color" content="#131314" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />
    <title>TURBO-10X PRO - Yapay Zeka Destekli At Yarışı Analiz ve Bülten Yönetim Sistemi</title>
    <meta name="description" content="Yapay Zeka Destekli At Yarışı Analiz ve Bülten Yönetim Sistemi" />
    <meta property="og:title" content="TURBO-10X PRO - Yapay Zeka Destekli At Yarışı Analiz ve Bülten Yönetim Sistemi" />
    <meta property="og:description" content="Yapay Zeka Destekli At Yarışı Analiz ve Bülten Yönetim Sistemi" />
    <style>
      html, body {
        background-color: #0b0c0e !important;
        color: #f8fafc;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        width: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        min-height: 100vh;
        background-color: #0b0c0e;
      }
      .turbo-init-splash {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #0b0c0e;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      .turbo-init-icon {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        background: radial-gradient(circle at 30% 30%, rgba(245, 158, 11, 0.25), rgba(15, 23, 42, 0.9));
        border: 1px solid rgba(245, 158, 11, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
        margin-bottom: 16px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), 0 0 16px rgba(245, 158, 11, 0.15);
      }
      .turbo-init-title {
        font-size: 16px;
        font-weight: 900;
        color: #f59e0b;
        letter-spacing: 0.08em;
        margin-bottom: 6px;
      }
      .turbo-init-bar-container {
        width: 180px;
        height: 4px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 9999px;
        overflow: hidden;
        margin-top: 14px;
      }
      .turbo-init-bar {
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, #f59e0b, #10b981);
        border-radius: 9999px;
        animation: turboBarAnim 1.4s ease-in-out infinite alternate;
      }
      @keyframes turboBarAnim {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      .turbo-init-sub {
        font-size: 12px;
        color: #94a3b8;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        letter-spacing: -0.01em;
      }
    </style>
    <script>
      // Tüm ortamlarda eski/bozuk ServiceWorker'ları temizle
      try {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var i = 0; i < regs.length; i++) { regs[i].unregister(); }
          }).catch(function() {});
        }
      } catch(e) {}
    </script>
  </head>
  <body class="bg-[#0b0c0e] text-[#E0E0E0] select-none antialiased overflow-x-hidden">
    <div id="root">
      <div class="turbo-init-splash">
        <div class="turbo-init-icon">
          🏇
        </div>
        <div class="turbo-init-title">TURBO 10X PRO</div>
        <div class="turbo-init-sub" id="turbo-init-status">Yarış Analiz Motoru Başlatılıyor...</div>
        <div class="turbo-init-bar-container">
          <div class="turbo-init-bar"></div>
        </div>
        <div id="turbo-init-retry-area" style="margin-top: 14px; display: none;">
          <button id="turbo-init-retry-btn" onclick="window.location.reload()" style="background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.4); color: #f59e0b; padding: 6px 16px; border-radius: 8px; font-size: 11px; font-family: monospace; font-weight: bold; cursor: pointer;">
            ⚡ Şimdi Aç
          </button>
        </div>
      </div>
    </div>
    <script>
      // 🛡️ TURBO 10X PRO — Otomatik Uyanma ve Canlılık Kalkanı (Pre-Boot Auto-Wakeup)
      (function() {
        var startTime = Date.now();
        var wakeCheckInterval = null;
        var statusEl = document.getElementById('turbo-init-status');
        var retryArea = document.getElementById('turbo-init-retry-area');

        function checkServerWakeup() {
          if (window.__TURBO_BOOTED__) {
            if (wakeCheckInterval) clearInterval(wakeCheckInterval);
            return;
          }

          var elapsedSec = Math.floor((Date.now() - startTime) / 1000);

          // 3.5 saniyeden uzun sürerse sunucunun uyandırıldığını kullanıcıya hissettir
          if (elapsedSec >= 3 && statusEl) {
            statusEl.textContent = 'Bulut Motoru Uyandırılıyor... (' + elapsedSec + ' sn)';
          }

          // 8 saniyeden uzun sürerse hızlı başlatma butonunu görünür yap
          if (elapsedSec >= 8 && retryArea) {
            retryArea.style.display = 'block';
          }

          // Arka planda sunucunun /api/health ucuna uyanma sinyali gönder
          var controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
          var timeout = controller ? setTimeout(function() { controller.abort(); }, 3500) : null;

          fetch('/api/health?wake=1&t=' + Date.now(), {
            cache: 'no-store',
            signal: controller ? controller.signal : undefined
          }).then(function(res) {
            if (timeout) clearTimeout(timeout);
            if (res.ok) {
              return res.json();
            }
          }).then(function(data) {
            if (data && data.status === 'ok') {
              if (statusEl) statusEl.textContent = 'Sunucu Hazır, Sistem Başlatılıyor...';
              
              // Sunucu uyanmış ama React modül yüklemesi uyku sırasında takılmışsa temiz bir yeniden başlatma yap
              setTimeout(function() {
                if (!window.__TURBO_BOOTED__) {
                  window.location.reload();
                }
              }, 2000);
            }
          }).catch(function() {
            if (timeout) clearTimeout(timeout);
          });
        }

        wakeCheckInterval = setInterval(checkServerWakeup, 1800);
        setTimeout(checkServerWakeup, 1200);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
