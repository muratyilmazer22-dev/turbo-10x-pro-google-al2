<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Radial Gradient: Pure Dark Luxury (#131314) -->
    <radialGradient id="bgDark" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#22242C" />
      <stop offset="60%" stop-color="#131314" />
      <stop offset="100%" stop-color="#08080A" />
    </radialGradient>

    <!-- Deep Warm Gold Gradient (Koyu Altın Sarısı / 24K Gold) -->
    <linearGradient id="deepGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA7" />
      <stop offset="25%" stop-color="#FFD700" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="75%" stop-color="#AA771C" />
      <stop offset="100%" stop-color="#6B4700" />
    </linearGradient>

    <linearGradient id="lightGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="50%" stop-color="#FFF3B0" />
      <stop offset="100%" stop-color="#C59B27" />
    </linearGradient>

    <linearGradient id="accentGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE885" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>

    <!-- Outer Gold Ring -->
    <linearGradient id="ringGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDF00" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#996515" stop-opacity="0.9" />
    </linearGradient>

    <!-- Gold Glow Filter -->
    <filter id="goldGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#D4AF37" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle App Canvas Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgDark)" />
  <rect width="496" height="496" x="8" y="8" rx="107" fill="none" stroke="url(#ringGold)" stroke-width="3" />
  <circle cx="256" cy="245" r="185" fill="none" stroke="url(#ringGold)" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.35" />

  <!-- DÖRTNALA ŞAHLANMIŞ KOŞAN ALTIN SAFKAN (Yüklenen Çin Atı Yılı Temalı Dörtnala Figür) -->
