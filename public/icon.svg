    <path d="M 125,72 L 140,50 L 148,68 Z" fill="#FFEAA7" />
    <circle cx="75" cy="148" r="5" fill="#131314" />
    <circle cx="76" cy="147" r="1.8" fill="#FFF" />
    <path d="M 50,158 C 45,162 48,168 55,165" fill="none" stroke="#6B4700" stroke-width="2.5" stroke-linecap="round" />

