  <!-- Alt Metin: TURBO 10X PRO (Lüks Tipografi) -->
  <text x="256" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="url(#deepGold)" text-anchor="middle" letter-spacing="5">TURBO 10X</text>
  <text x="256" y="475" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14" fill="#D4AF37" text-anchor="middle" letter-spacing="6">AI PRO RACING</text>
</svg>
